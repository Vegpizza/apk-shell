name: Build HTML App Shell

# Builds the Android shell APK. Commit this file to a GitHub repo and the
# build starts by itself. Download the result from the run's Artifacts.

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create project files
        run: |
          set -e
          mkdir -p "$(dirname 'settings.gradle')"
          cat > 'settings.gradle' <<'FILE_END_0'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "HtmlApkShell"
          include ':app'
          FILE_END_0
          mkdir -p "$(dirname 'build.gradle')"
          cat > 'build.gradle' <<'FILE_END_1'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          FILE_END_1
          mkdir -p "$(dirname 'gradle.properties')"
          cat > 'gradle.properties' <<'FILE_END_2'
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          FILE_END_2
          mkdir -p "$(dirname 'app/build.gradle')"
          cat > 'app/build.gradle' <<'FILE_END_3'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.htmlapk.shell'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.htmlapk.shell'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }

          dependencies {
              implementation 'androidx.webkit:webkit:1.11.0'
          }
          FILE_END_3
          mkdir -p "$(dirname 'app/src/main/AndroidManifest.xml')"
          cat > 'app/src/main/AndroidManifest.xml' <<'FILE_END_4'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission
                  android:name="android.permission.WRITE_EXTERNAL_STORAGE"
                  android:maxSdkVersion="28" />

              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <uses-feature android:name="android.hardware.location" android:required="false" />
              <uses-feature android:name="android.hardware.microphone" android:required="false" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="HTML App Shell"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|smallestScreenSize|uiMode|density|fontScale|layoutDirection"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          FILE_END_4
          mkdir -p "$(dirname 'app/src/main/res/values/styles.xml')"
          cat > 'app/src/main/res/values/styles.xml' <<'FILE_END_5'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:Theme.DeviceDefault.NoActionBar">
                  <item name="android:windowBackground">@android:color/black</item>
              </style>
          </resources>
          FILE_END_5
          mkdir -p "$(dirname 'app/src/main/assets/www/config.json')"
          cat > 'app/src/main/assets/www/config.json' <<'FILE_END_6'
          {
            "orientation": "portrait",
            "showStatusBar": true,
            "keepScreenOn": false,
            "secureScreen": false,
            "desktopMode": false,
            "backHistoryNavigation": true,
            "exitConfirmationDialog": false,
            "pauseAudioInBackground": false,
            "mixedContentMode": 2,
            "statusBarColor": "#000000",
            "navBarColor": "#000000",
            "webBackgroundColor": "#000000"
          }
          FILE_END_6
          mkdir -p "$(dirname 'app/src/main/assets/www/index.html')"
          cat > 'app/src/main/assets/www/index.html' <<'FILE_END_7'
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>HTML App Shell</title>
          <style>
            body { font-family: system-ui, sans-serif; background: #000; color: #fff; margin: 0; padding: 24px; }
            button, input { font-size: 16px; margin: 8px 0; }
          </style>
          </head>
          <body>
            <h1>Shell works</h1>
            <p>This is the built-in test page. The builder replaces it with your HTML.</p>
            <p><input type="file" id="f"> <span id="o"></span></p>
            <p><button id="d">Test save to Downloads</button></p>
            <script>
              document.getElementById('f').onchange = function (e) {
                var x = e.target.files[0];
                document.getElementById('o').textContent = x ? x.name + ' (' + x.size + ' bytes)' : '';
              };
              document.getElementById('d').onclick = function () {
                var a = document.createElement('a');
                a.href = URL.createObjectURL(new Blob(['hello'], { type: 'text/plain' }));
                a.download = 'shell-test.txt';
                document.body.appendChild(a);
                a.click();
                a.remove();
              };
            </script>
          </body>
          </html>
          FILE_END_7
          mkdir -p "$(dirname 'app/src/main/assets/hook.js')"
          cat > 'app/src/main/assets/hook.js' <<'FILE_END_8'
          (function () {
            if (window.__shellHook) return;
            window.__shellHook = true;

            function save(url, name) {
              fetch(url).then(function (r) { return r.blob(); }).then(function (b) {
                var f = new FileReader();
                f.onloadend = function () {
                  var s = String(f.result);
                  AndroidShell.saveBase64(name || 'download', b.type || 'application/octet-stream', s.substring(s.indexOf(',') + 1));
                };
                f.readAsDataURL(b);
              });
            }
            window.__shellSave = save;

            function handle(a) {
              if (a && a.hasAttribute && a.hasAttribute('download') && a.href &&
                  (a.href.indexOf('blob:') === 0 || a.href.indexOf('data:') === 0)) {
                save(a.href, a.getAttribute('download') || 'download');
                return true;
              }
              return false;
            }

            var oc = HTMLAnchorElement.prototype.click;
            HTMLAnchorElement.prototype.click = function () {
              if (!handle(this)) oc.call(this);
            };

            var od = EventTarget.prototype.dispatchEvent;
            EventTarget.prototype.dispatchEvent = function (e) {
              if (this instanceof HTMLAnchorElement && e && e.type === 'click' && handle(this)) return true;
              return od.call(this, e);
            };

            document.addEventListener('click', function (e) {
              var a = e.target && e.target.closest ? e.target.closest('a') : null;
              if (a && handle(a)) e.preventDefault();
            }, true);
          })();
          FILE_END_8
          mkdir -p "$(dirname 'app/src/main/java/com/htmlapk/shell/MainActivity.java')"
          cat > 'app/src/main/java/com/htmlapk/shell/MainActivity.java' <<'FILE_END_9'
          package com.htmlapk.shell;

          import android.Manifest;
          import android.app.Activity;
          import android.app.AlertDialog;
          import android.app.DownloadManager;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.content.pm.ActivityInfo;
          import android.content.pm.PackageManager;
          import android.graphics.Bitmap;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.GeolocationPermissions;
          import android.webkit.JavascriptInterface;
          import android.webkit.JsPromptResult;
          import android.webkit.JsResult;
          import android.webkit.PermissionRequest;
          import android.webkit.URLUtil;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.EditText;
          import android.widget.FrameLayout;
          import android.widget.Toast;

          import androidx.webkit.WebViewAssetLoader;

          import org.json.JSONObject;

          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends Activity {

              private static final int REQ_FILE = 1;
              private static final int REQ_MEDIA = 2;
              private static final int REQ_GEO = 3;
              private static final int REQ_STORAGE = 4;

              private static final String HOST = "appassets.androidplatform.net";
              private static final String HOME = "https://" + HOST + "/assets/www/index.html";

              private WebView web;
              private JSONObject cfg = new JSONObject();
              private WebViewAssetLoader loader;
              private volatile boolean ownPage = false;

              private ValueCallback<Uri[]> fileCb;
              private PermissionRequest pendingMedia;
              private GeolocationPermissions.Callback pendingGeoCb;
              private String pendingGeoOrigin;
              private String hookJs = "";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  cfg = readJsonAsset("www/config.json");
                  hookJs = readTextAsset("hook.js");

                  String ori = cfg.optString("orientation", "portrait");
                  if ("landscape".equals(ori)) {
                      setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE);
                  } else if ("portrait".equals(ori)) {
                      setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_PORTRAIT);
                  } else {
                      setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_UNSPECIFIED);
                  }

                  Window w = getWindow();
                  if (cfg.optBoolean("keepScreenOn", false)) {
                      w.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  }
                  if (cfg.optBoolean("secureScreen", false)) {
                      w.addFlags(WindowManager.LayoutParams.FLAG_SECURE);
                  }
                  if (!cfg.optBoolean("showStatusBar", true)) {
                      w.addFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN);
                  }

                  int sb = color("statusBarColor", Color.BLACK);
                  int nb = color("navBarColor", Color.BLACK);
                  w.addFlags(WindowManager.LayoutParams.FLAG_DRAWS_SYSTEM_BAR_BACKGROUNDS);
                  w.setStatusBarColor(sb);
                  w.setNavigationBarColor(nb);
                  int flags = w.getDecorView().getSystemUiVisibility();
                  if (isLight(sb)) {
                      flags |= View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR;
                  }
                  if (Build.VERSION.SDK_INT >= 26 && isLight(nb)) {
                      flags |= View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR;
                  }
                  w.getDecorView().setSystemUiVisibility(flags);

                  int bg = color("webBackgroundColor", Color.BLACK);
                  FrameLayout root = new FrameLayout(this);
                  root.setBackgroundColor(bg);
                  web = new WebView(this);
                  web.setBackgroundColor(bg);
                  root.addView(web, new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT));
                  setContentView(root);

                  loader = new WebViewAssetLoader.Builder()
                          .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                          .build();

                  setupWebView();
                  web.loadUrl(HOME);
              }

              private void setupWebView() {
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setAllowFileAccess(false);
                  s.setAllowContentAccess(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setGeolocationEnabled(true);
                  s.setMixedContentMode(cfg.optInt("mixedContentMode", WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE));
                  if (cfg.optBoolean("desktopMode", false)) {
                      String ua = s.getUserAgentString().replace("Mobile", "").replace("Android", "X11; Linux x86_64");
                      s.setUserAgentString(ua);
                      s.setUseWideViewPort(true);
                      s.setLoadWithOverviewMode(true);
                  }

                  web.addJavascriptInterface(new Bridge(), "AndroidShell");

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView v, WebResourceRequest r) {
                          return loader.shouldInterceptRequest(r.getUrl());
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                          return handleUrl(r.getUrl());
                      }

                      @Override
                      public void onPageStarted(WebView v, String url, Bitmap favicon) {
                          ownPage = isOwn(url);
                      }

                      @Override
                      public void onPageFinished(WebView v, String url) {
                          if (isOwn(url) && hookJs.length() > 0) {
                              v.evaluateJavascript(hookJs, null);
                          }
                      }
                  });

                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView v, ValueCallback<Uri[]> cb, FileChooserParams p) {
                          if (fileCb != null) {
                              fileCb.onReceiveValue(null);
                          }
                          fileCb = cb;
                          try {
                              startActivityForResult(p.createIntent(), REQ_FILE);
                          } catch (Exception e) {
                              fileCb = null;
                              return false;
                          }
                          return true;
                      }

                      @Override
                      public void onPermissionRequest(final PermissionRequest req) {
                          runOnUiThread(() -> {
                              if (req.getOrigin() == null || !HOST.equals(req.getOrigin().getHost())) {
                                  req.deny();
                                  return;
                              }
                              List<String> need = new ArrayList<>();
                              for (String r : req.getResources()) {
                                  if (PermissionRequest.RESOURCE_VIDEO_CAPTURE.equals(r) && !has(Manifest.permission.CAMERA)) {
                                      need.add(Manifest.permission.CAMERA);
                                  }
                                  if (PermissionRequest.RESOURCE_AUDIO_CAPTURE.equals(r) && !has(Manifest.permission.RECORD_AUDIO)) {
                                      need.add(Manifest.permission.RECORD_AUDIO);
                                  }
                              }
                              if (need.isEmpty()) {
                                  req.grant(req.getResources());
                              } else {
                                  pendingMedia = req;
                                  requestPermissions(need.toArray(new String[0]), REQ_MEDIA);
                              }
                          });
                      }

                      @Override
                      public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback cb) {
                          if (origin == null || !origin.contains(HOST)) {
                              cb.invoke(origin, false, false);
                              return;
                          }
                          if (has(Manifest.permission.ACCESS_FINE_LOCATION) || has(Manifest.permission.ACCESS_COARSE_LOCATION)) {
                              cb.invoke(origin, true, false);
                          } else {
                              pendingGeoCb = cb;
                              pendingGeoOrigin = origin;
                              requestPermissions(new String[]{
                                      Manifest.permission.ACCESS_FINE_LOCATION,
                                      Manifest.permission.ACCESS_COARSE_LOCATION}, REQ_GEO);
                          }
                      }

                      @Override
                      public boolean onJsAlert(WebView v, String url, String msg, final JsResult r) {
                          new AlertDialog.Builder(MainActivity.this)
                                  .setMessage(msg)
                                  .setPositiveButton(android.R.string.ok, (d, i) -> r.confirm())
                                  .setOnCancelListener(d -> r.cancel())
                                  .show();
                          return true;
                      }

                      @Override
                      public boolean onJsConfirm(WebView v, String url, String msg, final JsResult r) {
                          new AlertDialog.Builder(MainActivity.this)
                                  .setMessage(msg)
                                  .setPositiveButton(android.R.string.ok, (d, i) -> r.confirm())
                                  .setNegativeButton(android.R.string.cancel, (d, i) -> r.cancel())
                                  .setOnCancelListener(d -> r.cancel())
                                  .show();
                          return true;
                      }

                      @Override
                      public boolean onJsPrompt(WebView v, String url, String msg, String def, final JsPromptResult r) {
                          final EditText et = new EditText(MainActivity.this);
                          et.setText(def);
                          new AlertDialog.Builder(MainActivity.this)
                                  .setMessage(msg)
                                  .setView(et)
                                  .setPositiveButton(android.R.string.ok, (d, i) -> r.confirm(et.getText().toString()))
                                  .setNegativeButton(android.R.string.cancel, (d, i) -> r.cancel())
                                  .setOnCancelListener(d -> r.cancel())
                                  .show();
                          return true;
                      }
                  });

                  web.setDownloadListener((url, ua, cd, mime, len) -> {
                      String name = URLUtil.guessFileName(url, cd, mime);
                      if (url.startsWith("blob:") || url.startsWith("data:")) {
                          web.evaluateJavascript("window.__shellSave && window.__shellSave("
                                  + JSONObject.quote(url) + "," + JSONObject.quote(name) + ")", null);
                          return;
                      }
                      try {
                          DownloadManager.Request req = new DownloadManager.Request(Uri.parse(url));
                          req.setMimeType(mime);
                          req.addRequestHeader("User-Agent", ua);
                          req.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                          req.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, name);
                          ((DownloadManager) getSystemService(DOWNLOAD_SERVICE)).enqueue(req);
                          toast("Downloading " + name);
                      } catch (Exception e) {
                          handleUrl(Uri.parse(url));
                      }
                  });
              }

              private boolean isOwn(String url) {
                  return url != null && url.startsWith("https://" + HOST + "/");
              }

              private boolean handleUrl(Uri u) {
                  String sch = u.getScheme();
                  if ("https".equals(sch) && HOST.equals(u.getHost())) {
                      return false;
                  }
                  try {
                      startActivity(new Intent(Intent.ACTION_VIEW, u));
                  } catch (Exception ignored) {
                  }
                  return true;
              }

              private class Bridge {
                  @JavascriptInterface
                  public void saveBase64(String name, String mime, String b64) {
                      if (!ownPage) {
                          return;
                      }
                      try {
                          byte[] data = Base64.decode(b64, Base64.DEFAULT);
                          String saved = saveToDownloads(name, mime, data);
                          if (saved != null) {
                              toast("Saved to Downloads: " + saved);
                          }
                      } catch (Exception e) {
                          toast("Save failed: " + e.getMessage());
                      }
                  }
              }

              private String saveToDownloads(String rawName, String mime, byte[] data) throws Exception {
                  String name = rawName.replaceAll("[\\\\/:*?\"<>|]", "_");
                  if (Build.VERSION.SDK_INT >= 29) {
                      ContentValues v = new ContentValues();
                      v.put(MediaStore.Downloads.DISPLAY_NAME, name);
                      v.put(MediaStore.Downloads.MIME_TYPE, mime);
                      v.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                      Uri uri = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, v);
                      if (uri == null) {
                          throw new Exception("could not create file");
                      }
                      OutputStream os = getContentResolver().openOutputStream(uri);
                      os.write(data);
                      os.close();
                      return name;
                  }
                  if (!has(Manifest.permission.WRITE_EXTERNAL_STORAGE)) {
                      runOnUiThread(() -> requestPermissions(
                              new String[]{Manifest.permission.WRITE_EXTERNAL_STORAGE}, REQ_STORAGE));
                      toast("Allow storage permission, then try again");
                      return null;
                  }
                  File dir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                  dir.mkdirs();
                  File f = new File(dir, name);
                  int n = 1;
                  while (f.exists()) {
                      int dot = name.lastIndexOf('.');
                      String base = dot > 0 ? name.substring(0, dot) : name;
                      String ext = dot > 0 ? name.substring(dot) : "";
                      f = new File(dir, base + " (" + n + ")" + ext);
                      n++;
                  }
                  FileOutputStream fos = new FileOutputStream(f);
                  fos.write(data);
                  fos.close();
                  return f.getName();
              }

              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  super.onActivityResult(req, res, data);
                  if (req == REQ_FILE && fileCb != null) {
                      fileCb.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(res, data));
                      fileCb = null;
                  }
              }

              @Override
              public void onRequestPermissionsResult(int code, String[] perms, int[] results) {
                  super.onRequestPermissionsResult(code, perms, results);
                  if (code == REQ_MEDIA && pendingMedia != null) {
                      List<String> ok = new ArrayList<>();
                      for (String r : pendingMedia.getResources()) {
                          if (PermissionRequest.RESOURCE_VIDEO_CAPTURE.equals(r) && has(Manifest.permission.CAMERA)) {
                              ok.add(r);
                          } else if (PermissionRequest.RESOURCE_AUDIO_CAPTURE.equals(r) && has(Manifest.permission.RECORD_AUDIO)) {
                              ok.add(r);
                          }
                      }
                      if (ok.isEmpty()) {
                          pendingMedia.deny();
                      } else {
                          pendingMedia.grant(ok.toArray(new String[0]));
                      }
                      pendingMedia = null;
                  } else if (code == REQ_GEO && pendingGeoCb != null) {
                      boolean granted = has(Manifest.permission.ACCESS_FINE_LOCATION)
                              || has(Manifest.permission.ACCESS_COARSE_LOCATION);
                      pendingGeoCb.invoke(pendingGeoOrigin, granted, false);
                      pendingGeoCb = null;
                  }
              }

              @Override
              public void onBackPressed() {
                  if (cfg.optBoolean("backHistoryNavigation", true) && web.canGoBack()) {
                      web.goBack();
                      return;
                  }
                  if (cfg.optBoolean("exitConfirmationDialog", false)) {
                      new AlertDialog.Builder(this)
                              .setMessage("Exit the app?")
                              .setPositiveButton(android.R.string.ok, (d, i) -> finish())
                              .setNegativeButton(android.R.string.cancel, null)
                              .show();
                      return;
                  }
                  super.onBackPressed();
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  if (cfg.optBoolean("pauseAudioInBackground", false)) {
                      web.onPause();
                  }
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  web.onResume();
              }

              @Override
              protected void onDestroy() {
                  if (web != null) {
                      web.destroy();
                  }
                  super.onDestroy();
              }

              private boolean has(String perm) {
                  return checkSelfPermission(perm) == PackageManager.PERMISSION_GRANTED;
              }

              private void toast(final String msg) {
                  runOnUiThread(() -> Toast.makeText(MainActivity.this, msg, Toast.LENGTH_LONG).show());
              }

              private int color(String key, int def) {
                  try {
                      return Color.parseColor(cfg.optString(key, ""));
                  } catch (Exception e) {
                      return def;
                  }
              }

              private boolean isLight(int c) {
                  return (0.299 * Color.red(c) + 0.587 * Color.green(c) + 0.114 * Color.blue(c)) > 160;
              }

              private String readTextAsset(String path) {
                  try {
                      InputStream in = getAssets().open(path);
                      ByteArrayOutputStream o = new ByteArrayOutputStream();
                      byte[] buf = new byte[4096];
                      int n;
                      while ((n = in.read(buf)) > 0) {
                          o.write(buf, 0, n);
                      }
                      in.close();
                      return o.toString("UTF-8");
                  } catch (Exception e) {
                      return "";
                  }
              }

              private JSONObject readJsonAsset(String path) {
                  try {
                      return new JSONObject(readTextAsset(path));
                  } catch (Exception e) {
                      return new JSONObject();
                  }
              }
          }
          FILE_END_9
          python3 - <<'ICON_END'
          import zlib, struct, os
          W = H = 192
          rows = []
          for y in range(H):
              row = bytearray([0])
              for x in range(W):
                  d = ((x - 96) ** 2 + (y - 96) ** 2) ** 0.5
                  if 40 <= d < 62:
                      px = (255, 255, 255, 255)
                  else:
                      px = (33, 150, 243, 255)
                  row.extend(px)
              rows.append(bytes(row))
          def chunk(t, d):
              c = struct.pack(">I", len(d)) + t + d
              return c + struct.pack(">I", zlib.crc32(t + d) & 0xffffffff)
          png = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", struct.pack(">IIBBBBB", W, H, 8, 6, 0, 0, 0)) + chunk(b"IDAT", zlib.compress(b"".join(rows))) + chunk(b"IEND", b"")
          os.makedirs("app/src/main/res/mipmap-xxxhdpi", exist_ok=True)
          open("app/src/main/res/mipmap-xxxhdpi/ic_launcher.png", "wb").write(png)
          ICON_END
          find . -type f -not -path './.git/*' | sort

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: html-app-shell
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
